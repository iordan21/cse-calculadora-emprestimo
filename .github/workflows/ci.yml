name: CI

# Roda a cada push na main e em todo pull request. O objetivo é simples:
# nenhum commit entra na main sem que os testes da Tabela Price tenham passado.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes de unidade
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        # Cuida do cache de dependências entre execuções.
        uses: gradle/actions/setup-gradle@v4

      - name: Permitir execução do wrapper
        run: chmod +x ./gradlew

      - name: Rodar os testes
        run: ./gradlew test --no-daemon

      - name: Guardar o relatório
        # `always()` para que o relatório suba também quando um teste falha —
        # é justamente aí que ele serve para alguma coisa.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore
